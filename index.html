                    particlesJS('particles-js', {
                        particles: {
                            number: { value: 30 },
                            color: { value: '#ffffff' },

                const icon = document.getElementById('themeIcon');

            function initAuthEvents(auth, database) {

                      passInp = document.getElementById('userInputPass'),
                      btnLogin = document.getElementById('_0x_lgb'),
                      btnLogout = document.getElementById('btnLogout'),

                        showError('ইমেইল এবং পাসওয়ার্ড প্রদান করুন');
                        return;
                    }
                    auth.signInWithEmailAndPassword(e, p).catch(err => showError(err.message));
                });

                btnLogout.addEventListener('click', () => {

                        sessionRef.off(); // Remove Realtime Listener
                    }
                    auth.signOut();
                });

                            lastLogin: firebase.database.ServerValue.TIMESTAMP

            function initTableOperations() {
                const btnOpenModal = document.getElementById('btnOpenAddModal');
                const btnCloseModal = document.getElementById('btnCloseDataModal');
                const dataModal = document.getElementById('dataRowModal');
                const dataForm = document.getElementById('dataRowForm');
                const searchInput = document.getElementById('sheetSearchInput');

                btnOpenModal.addEventListener('click', () => {
                    dataForm.reset();
                    document.getElementById('rowOriginalId').value = '';
                    document.getElementById('rowReceiptNo').value = `REC-${Math.floor(100000 + Math.random() * 900000)}`;
                    document.getElementById('dataModalTitle').innerHTML = '<i class="fas fa-receipt" style="color:#38bdf8"></i> New Entry';
                    dataModal.style.display = 'flex';
                });

                btnCloseModal.addEventListener('click', () => {
                    dataModal.style.display = 'none';
                });

                dataForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const receiptNo = document.getElementById('rowReceiptNo').value.trim();
                    const clientId = document.getElementById('rowId').value.trim();
                    const name = document.getElementById('rowName').value.trim();
                    const phone = document.getElementById('rowPhone').value.trim();
                    const address = document.getElementById('rowAddress').value.trim();
                    const month = document.getElementById('rowMonth').value.trim();
                    const pkg = document.getElementById('rowPackage').value.trim();
                    const amount = document.getElementById('rowAmount').value.trim();
                    const status = document.getElementById('rowStatus').value;

                    const originalIdx = document.getElementById('rowOriginalId').value;
                    const newRow = { receiptNo, clientId, name, phone, address, month, pkg, amount, status };

                    if (originalIdx !== '') {
                        recordsList[parseInt(originalIdx)] = newRow;
                    } else {
                        recordsList.unshift(newRow);
                    }

                    dataModal.style.display = 'none';
                    renderTable();
                });

                searchInput.addEventListener('input', () => {
                    currentPage = 1;
                    renderTable();
                });

                document.getElementById('btnPrevPage').addEventListener('click', () => {
                    if (currentPage > 1) {
                        currentPage--;
                        renderTable();
                    }
                });

                document.getElementById('btnNextPage').addEventListener('click', () => {
                    const filtered = getFilteredRecords();
                    if (currentPage * recordsPerPage < filtered.length) {
                        currentPage++;
                        renderTable();
                    }
                });
            }

            function initExportAndUpload() {
                const fileInput = document.getElementById('excelFileInput');
                const btnTriggerUpload = document.getElementById('btnTriggerUpload');

                btnTriggerUpload.addEventListener('click', () => fileInput.click());

                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                        if (jsonData.length > 1) {
                            for (let i = 1; i < jsonData.length; i++) {
                                const row = jsonData[i];
                                if (row.length === 0) continue;
                                recordsList.push({
                                    receiptNo: row[0] || '',
                                    clientId: row[1] || '',
                                    name: row[2] || '',
                                    phone: row[3] || '',
                                    address: row[4] || '',
                                    month: row[5] || '',
                                    pkg: row[6] || '',
                                    amount: row[7] || '',
                                    status: row[8] ? (row[8].toString().toLowerCase().includes('paid') ? 'Paid' : 'Pending') : 'Pending'
                                });
                            }
                            renderTable();
                            alert('Excel ফাইল সফলভাবে আপলোড হয়েছে!');
                        }
                    };
                    reader.readAsArrayBuffer(file);
                });

                document.getElementById('btnExportAll').addEventListener('click', () => exportToExcel());
            }
        })();

        /* Filter Navigation Functions */
        function filterByNav(type) {
            currentFilter = type;
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            
            const titleElement = document.getElementById('activePageTitle');
            if(type === 'all') {
                document.getElementById('btnNavAllCust').classList.add('active');
                titleElement.innerHTML = `<i class="fas fa-users" style="color:#38bdf8"></i> All Customer List`;
            } else if(type === 'due') {
                document.getElementById('btnNavDueCust').classList.add('active');
                titleElement.innerHTML = `<i class="fas fa-clock" style="color:#f59e0b"></i> Due Bill Customer List`;
            } else if(type === 'paid') {
                document.getElementById('btnNavPaidCust').classList.add('active');
                titleElement.innerHTML = `<i class="fas fa-check-circle" style="color:#4CAF50"></i> Paid Customer List`;
            }
            currentPage = 1;
            renderTable();
        }

        function triggerAllBillGen() {
            if (recordsList.length === 0) {
                alert('বিল তৈরি করার জন্য কোনো কাস্টমার ডাটা পাওয়া যায়নি!');
                return;
            }

            const now = new Date();
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const currentMonthStr = `${monthNames[now.getMonth()]} ${now.getFullYear()}`;

            if (!confirm(`আপনি কি ${currentMonthStr} মাসের জন্য সমস্ত গ্রাহকের বিল জেনারেট করতে চান?`)) {
                return;
            }

            const uniqueClientsMap = new Map();
            recordsList.forEach(item => {
                if (item.clientId && !uniqueClientsMap.has(item.clientId)) {
                    uniqueClientsMap.set(item.clientId, item);
                }
            });

            let createdCount = 0;
            let skippedCount = 0;

            uniqueClientsMap.forEach((client) => {
                const exists = recordsList.some(r => r.clientId === client.clientId && r.month === currentMonthStr);
                
                if (!exists) {
                    const newBill = {
                        receiptNo: `REC-${Math.floor(100000 + Math.random() * 900000)}`,
                        clientId: client.clientId,
                        name: client.name,
                        phone: client.phone,
                        address: client.address,
                        month: currentMonthStr,
                        pkg: client.pkg,
                        amount: client.amount,
                        status: 'Pending'
                    };
                    recordsList.unshift(newBill);
                    createdCount++;
                } else {
                    skippedCount++;
                }
            });

            renderTable();
            alert(`বিল জেনারেট সম্পন্ন!\n\nনতুন বিল তৈরি হয়েছে: ${createdCount} টি\nইতিমধ্যে প্রস্তুত করা ছিল: ${skippedCount} টি`);
        }

        function triggerSingleBillGen() {
            document.getElementById('dataRowForm').reset();
            document.getElementById('rowOriginalId').value = '';
            document.getElementById('rowReceiptNo').value = `REC-${Math.floor(100000 + Math.random() * 900000)}`;
            document.getElementById('dataModalTitle').innerHTML = '<i class="fas fa-file-invoice-dollar" style="color:#38bdf8"></i> Single Custom Bill Generate';
            document.getElementById('dataRowModal').style.display = 'flex';
        }

        function openSMSModal(type) {
            const modal = document.getElementById('smsModal');
            const targetInp = document.getElementById('smsTargetPhone');
            const title = document.getElementById('smsModalTitle');
            
            if(type === 'all') {
                title.innerHTML = `<i class="fas fa-paper-plane" style="color:#e11d48"></i> Send Bulk SMS to All Due Customers`;
                targetInp.style.display = 'none';
                document.getElementById('smsTextBody').value = "সম্মানিত গ্রাহক, আপনার চলতি মাসের ইন্টারনেট বিল বকেয়া রয়েছে। দ্রুত পরিশোধ করার জন্য অনুরোধ করা হচ্ছে।";
            } else {
                title.innerHTML = `<i class="fas fa-sms" style="color:#f59e0b"></i> Send Single Customer SMS`;
                targetInp.style.display = 'block';
                targetInp.value = '';
                document.getElementById('smsTextBody').value = "";
            }
            modal.style.display = 'flex';
        }

        function sendSMS() {
            const body = document.getElementById('smsTextBody').value.trim();
            if(!body) {
                alert('মেসেজ খালি রাখা যাবে না!');
                return;
            }
            alert('SMS পাঠানো সম্পন্ন হয়েছে!');
            document.getElementById('smsModal').style.display = 'none';
        }
    </script>
