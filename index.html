<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>ESER-ALL Billing & Spreadsheet Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- SheetJS CDN (1,00,000+ ডাটার Excel/CSV আপলোড ও প্রসেস করার জন্য) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #121212;
            color: #f0f0f0;
            transition: background .3s, color .3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        body.light-mode {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
        }

        @keyframes gradientBG {
            0% { background-position: 0 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 0;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .theme-toggle {
            position: fixed;
            left: 20px;
            bottom: 20px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: rgba(255, 255, 255, .1);
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
        }

        .dashboard {
            position: relative;
            z-index: 1;
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .main-header {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: .5px;
        }

        .sheet-wrapper {
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        body.light-mode .sheet-wrapper {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .sheet-toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-input {
            padding: 9px 14px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            outline: none;
            width: 250px;
            font-size: 14px;
        }

        .btn {
            padding: 9px 16px;
            border-radius: 6px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-primary { background: #38bdf8; color: #000; }
        .btn-primary:hover { background: #0284c7; color: #fff; }

        .btn-success { background: #4CAF50; color: #fff; }
        .btn-success:hover { background: #388E3C; }

        .btn-warning { background: #f59e0b; color: #000; }
        .btn-warning:hover { background: #d97706; color: #fff; }

        .btn-danger { background: #f44336; color: #fff; }
        .btn-danger:hover { background: #d32f2f; }

        .btn-secondary { background: #6b7280; color: #fff; }

        .table-container {
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        th {
            position: sticky;
            top: 0;
            background: #252526;
            color: #38bdf8;
            padding: 12px 15px;
            font-weight: 700;
            border-bottom: 2px solid #444;
            z-index: 10;
        }

        td {
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            white-space: nowrap;
        }

        tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
        tr:hover { background: rgba(255, 255, 255, 0.08); }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            font-size: 13px;
            color: #aaa;
        }

        .data-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            background: #1e1e1e;
            color: #fff;
            padding: 24px;
            border-radius: 10px;
            width: 360px;
            border: 1px solid #333;
            text-align: center;
            position: relative;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            border-radius: 6px;
            outline: 0;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 16px;
            color: #aaa;
            cursor: pointer;
        }

        .badge-info {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="particles-js"></div>

    <div class="theme-toggle" id="themeToggleBtn">
        <i class="fas fa-moon" id="themeIcon"></i>
    </div>

    <div class="dashboard" id="mainDashboard">
        <div class="main-header">ESER-ALL Billing Management</div>

        <div class="sheet-wrapper">
            <div class="sheet-toolbar">
                <div class="toolbar-group">
                    <h2 style="font-size: 20px;"><i class="fas fa-file-invoice-dollar" style="color: #38bdf8;"></i> Client Bill List</h2>
                    <span class="badge-info" id="totalRecordsCount">Total Rows: 0</span>
                </div>
                
                <div class="toolbar-group">
                    <input type="text" id="sheetSearchInput" class="search-input" placeholder="Search customer ID or name...">
                    
                    <!-- File Upload Input Hidden -->
                    <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display:none;">
                    
                    <button class="btn btn-warning" id="btnTriggerUpload"><i class="fas fa-file-upload"></i> Upload Excel/CSV</button>
                    <button class="btn btn-success" id="btnOpenAddModal"><i class="fas fa-plus"></i> Manual Entry</button>
                    <button class="btn btn-primary" id="btnExportData"><i class="fas fa-file-download"></i> Export Sheet</button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Client ID / Reg</th>
                            <th>Customer Name</th>
                            <th>Package / Service</th>
                            <th>Bill Amount</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="sheetTableBody">
                        <tr>
                            <td colspan="6" style="text-align:center; padding: 30px; color:#aaa;">
                                <i class="fas fa-folder-open" style="font-size: 30px; margin-bottom: 100px;"></i><br>
                                কোনো ডাটা নেই। Excel / CSV ফাইল **Upload** করুন অথবা **Manual Entry** অপশনে ক্লিক করুন।
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <div id="pageInfo">Showing Page 0 of 0</div>
                <div class="toolbar-group">
                    <button class="btn btn-secondary" id="btnPrevPage"><i class="fas fa-chevron-left"></i> Prev</button>
                    <button class="btn btn-secondary" id="btnNextPage">Next <i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add / Edit Modal -->
    <div class="data-modal" id="dataRowModal" style="display:none;">
        <div class="modal-content">
            <span class="close-btn" id="btnCloseDataModal"><i class="fas fa-times"></i></span>
            <h3 id="dataModalTitle" style="margin-bottom:15px"><i class="fas fa-edit" style="color:#38bdf8"></i> Bill Entry</h3>
            <form id="dataRowForm">
                <input type="hidden" id="rowOriginalId">
                <input type="text" id="rowId" placeholder="Client ID / Account No" required>
                <input type="text" id="rowName" placeholder="Customer Name" required>
                <input type="text" id="rowPackage" placeholder="Package / Service" required>
                <input type="number" id="rowAmount" placeholder="Bill Amount (Tk)" required>
                <input type="text" id="rowStatus" placeholder="Status (e.g. Paid/Unpaid)" required>
                <button type="submit" class="btn btn-success" style="width:100%;">Save Record</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

    <script>
        let dataset = [];
        let filteredDataset = [];
        let currentPage = 1;
        const pageSize = 50;

        document.addEventListener("DOMContentLoaded", () => {
            initParticles();
            setupThemeToggle();
            setupSpreadsheetEvents();
        });

        function initParticles() {
            if (typeof particlesJS !== 'undefined') {
                particlesJS('particles-js', {
                    particles: {
                        number: { value: 30 },
                        color: { value: "#ffffff" },
                        opacity: { value: 0.15 },
                        size: { value: 3 },
                        line_linked: { enable: true, distance: 150, color: "#ffffff", opacity: 0.08 }
                    }
                });
            }
        }

        function setupThemeToggle() {
            const toggleBtn = document.getElementById('themeToggleBtn');
            const icon = document.getElementById('themeIcon');
            toggleBtn.addEventListener('click', () => {
                document.body.classList.toggle('light-mode');
                icon.className = document.body.classList.contains('light-mode') ? 'fas fa-sun' : 'fas fa-moon';
            });
        }

        function setupSpreadsheetEvents() {
            document.getElementById('sheetSearchInput').addEventListener('input', handleSearch);
            document.getElementById('btnPrevPage').addEventListener('click', () => changePage(-1));
            document.getElementById('btnNextPage').addEventListener('click', () => changePage(1));
            
            // Upload Events
            const fileInput = document.getElementById('excelFileInput');
            document.getElementById('btnTriggerUpload').addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileUpload);

            // Export Event
            document.getElementById('btnExportData').addEventListener('click', exportToExcel);

            // Modal Events
            document.getElementById('btnOpenAddModal').addEventListener('click', () => openDataModal());
            document.getElementById('btnCloseDataModal').addEventListener('click', closeDataModal);
            document.getElementById('dataRowForm').addEventListener('submit', handleFormSubmit);
        }

        // --- EXCEL / CSV BULK UPLOAD ENGINE ---
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            const tbody = document.getElementById('sheetTableBody');
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px;"><i class="fas fa-spinner fa-spin" style="font-size:24px;"></i><br><br>Processing 100,000+ Records... Please wait...</td></tr>`;

            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    const jsonResult = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    if (jsonResult.length < 2) {
                        alert("আপলোড করা ফাইলে পর্যাপ্ত ডাটা পাওয়া যায়নি!");
                        return;
                    }

                    // Mapping Data
                    dataset = [];
                    for (let i = 1; i < jsonResult.length; i++) {
                        const row = jsonResult[i];
                        if(row.length > 0) {
                            dataset.push({
                                id: row[0] || `ID-${i}`,
                                name: row[1] || 'N/A',
                                package: row[2] || 'Basic',
                                amount: row[3] || 0,
                                status: row[4] || 'Pending'
                            });
                        }
                    }

                    filteredDataset = [...dataset];
                    document.getElementById('totalRecordsCount').innerText = `Total Rows: ${dataset.length.toLocaleString()}`;
                    currentPage = 1;
                    renderTable();
                    alert(`সফলভাবে ${dataset.length.toLocaleString()} টি ডাটা লোড হয়েছে!`);

                } catch (err) {
                    alert("ফাইল প্রসেস করতে সমস্যা হয়েছে। সঠিক Excel (.xlsx) অথবা CSV ফাইল নির্বাচন করুন।");
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // --- RENDER TABLE ---
        function renderTable() {
            const tbody = document.getElementById('sheetTableBody');
            tbody.innerHTML = '';

            const startIdx = (currentPage - 1) * pageSize;
            const endIdx = Math.min(startIdx + pageSize, filteredDataset.length);
            const pageData = filteredDataset.slice(startIdx, endIdx);

            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:20px;">কোনো ডাটা পাওয়া যায়নি।</td></tr>`;
                document.getElementById('pageInfo').innerText = `Page 0 of 0`;
                return;
            }

            pageData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHtml(row.id)}</td>
                    <td><b>${escapeHtml(row.name)}</b></td>
                    <td>${escapeHtml(row.package)}</td>
                    <td>${escapeHtml(row.amount)} Tk</td>
                    <td><span class="badge-info">${escapeHtml(row.status)}</span></td>
                    <td>
                        <button class="btn btn-primary" onclick="editRow('${row.id}')" style="padding: 4px 8px; font-size:11px;"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-danger" onclick="deleteRow('${row.id}')" style="padding: 4px 8px; font-size:11px;"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            const totalPages = Math.ceil(filteredDataset.length / pageSize);
            document.getElementById('pageInfo').innerText = `Page ${currentPage} of ${totalPages} (${startIdx + 1}-${endIdx} of ${filteredDataset.length.toLocaleString()})`;
            
            document.getElementById('btnPrevPage').disabled = currentPage === 1;
            document.getElementById('btnNextPage').disabled = currentPage >= totalPages;
        }

        function handleSearch(e) {
            const query = e.target.value.toLowerCase().trim();
            filteredDataset = dataset.filter(item => 
                item.name.toString().toLowerCase().includes(query) ||
                item.id.toString().toLowerCase().includes(query) ||
                item.package.toString().toLowerCase().includes(query)
            );
            currentPage = 1;
            renderTable();
        }

        function changePage(direction) {
            const totalPages = Math.ceil(filteredDataset.length / pageSize);
            if (currentPage + direction >= 1 && currentPage + direction <= totalPages) {
                currentPage += direction;
                renderTable();
            }
        }

        // --- MANUAL ENTRY & EDIT ---
        function openDataModal(row = null) {
            const modal = document.getElementById('dataRowModal');
            const title = document.getElementById('dataModalTitle');
            
            if (row) {
                title.innerHTML = `<i class="fas fa-edit" style="color:#38bdf8"></i> Edit Entry`;
                document.getElementById('rowOriginalId').value = row.id;
                document.getElementById('rowId').value = row.id;
                document.getElementById('rowName').value = row.name;
                document.getElementById('rowPackage').value = row.package;
                document.getElementById('rowAmount').value = row.amount;
                document.getElementById('rowStatus').value = row.status;
            } else {
                title.innerHTML = `<i class="fas fa-plus" style="color:#4CAF50"></i> Manual Bill Entry`;
                document.getElementById('dataRowForm').reset();
                document.getElementById('rowOriginalId').value = '';
            }
            modal.style.display = 'flex';
        }

        function closeDataModal() {
            document.getElementById('dataRowModal').style.display = 'none';
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const origId = document.getElementById('rowOriginalId').value;
            const newId = document.getElementById('rowId').value;
            
            const rowData = {
                id: newId,
                name: document.getElementById('rowName').value,
                package: document.getElementById('rowPackage').value,
                amount: document.getElementById('rowAmount').value,
                status: document.getElementById('rowStatus').value
            };

            if (origId) {
                const idx = dataset.findIndex(r => r.id === origId);
                if (idx !== -1) dataset[idx] = rowData;
            } else {
                dataset.unshift(rowData);
            }

            filteredDataset = [...dataset];
            document.getElementById('totalRecordsCount').innerText = `Total Rows: ${dataset.length.toLocaleString()}`;
            closeDataModal();
            renderTable();
        }

        function editRow(id) {
            const row = dataset.find(r => r.id === id);
            if (row) openDataModal(row);
        }

        function deleteRow(id) {
            if (confirm(`আপনি কি সত্যিই ID: ${id} মুছে ফেলতে চান?`)) {
                dataset = dataset.filter(r => r.id !== id);
                filteredDataset = filteredDataset.filter(r => r.id !== id);
                document.getElementById('totalRecordsCount').innerText = `Total Rows: ${dataset.length.toLocaleString()}`;
                renderTable();
            }
        }

        // EXPORT TO EXCEL
        function exportToExcel() {
            if (dataset.length === 0) {
                alert("ডাউনলোড করার মতো কোনো ডাটা নেই!");
                return;
            }
            const worksheet = XLSX.utils.json_to_sheet(dataset);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Billing Data");
            XLSX.writeFile(workbook, "Client_Billing_Report.xlsx");
        }

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
