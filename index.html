<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESER-ALL Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- SheetJS Library for Processing Excel/CSV Files -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <style>
    :root {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --card-hover: rgba(255, 255, 255, 0.2);
      --modal-bg: #1e293b;
      --modal-border: #334155;
      --input-bg: #0f172a;
      --input-border: #475569;
      --icon-color: #38bdf8;
      --bg-overlay: rgba(15, 23, 42, 0.75);
    }

    [data-theme="light"] {
      --bg-color: #e0f2fe;
      --text-color: #0c4a6e;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(56, 189, 248, 0.3);
      --card-hover: #ffffff;
      --modal-bg: #ffffff;
      --modal-border: #bae6fd;
      --input-bg: #f0f9ff;
      --input-border: #7dd3fc;
      --icon-color: #0284c7;
      --bg-overlay: rgba(224, 242, 254, 0.45);
    }

    [data-theme="light"] body {
      animation: skyColorShift 18s infinite alternate ease-in-out;
    }

    @keyframes skyColorShift {
      0% { background-color: #e0f2fe; }
      33% { background-color: #bae6fd; }
      66% { background-color: #e0f7fa; }
      100% { background-color: #f0f9ff; }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; font-family: 'Segoe UI', sans-serif; }
    
    body {
      margin: 0; padding: 0;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex; flex-direction: column; justify-content: space-between;
      transition: background 0.5s ease, color 0.5s ease;
      position: relative;
    }

    .bg-video-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden; z-index: 0;
    }

    .bg-video-container video {
      width: 100%; height: 100%; object-fit: cover;
      filter: brightness(0.85) contrast(1.05);
    }

    .bg-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-overlay); transition: background 0.5s ease;
    }
    
    .theme-toggle-btn {
      position: fixed; top: 20px; right: 20px; z-index: 1001;
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: var(--text-color); padding: 10px 16px; border-radius: 50px;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      font-weight: bold; backdrop-filter: blur(8px);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); transition: all 0.3s ease;
    }
    .theme-toggle-btn:hover { background: var(--card-hover); transform: scale(1.03); }

    .dashboard { position: relative; z-index: 1; padding: 30px 15px 40px; text-align: center; }
    .main-header { font-size: 32px; font-weight: 800; margin-bottom: 25px; margin-top: 10px; letter-spacing: 0.5px; }
    .section-title { font-size: 22px; margin: 25px 0 15px; display: flex; justify-content: center; align-items: center; gap: 10px; color: var(--text-color); }
    .section-title i { color: var(--icon-color); }

    /* Interactive Excel & Upload Container */
    .worksheet-section {
      max-width: 1100px;
      margin: 0 auto 30px auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .upload-box {
      background: var(--card-bg);
      border: 2px dashed var(--card-border);
      border-radius: 14px;
      padding: 25px;
      text-align: center;
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .upload-box:hover {
      border-color: var(--icon-color);
      background: var(--card-hover);
    }
    .upload-box i {
      font-size: 40px;
      color: var(--icon-color);
      margin-bottom: 10px;
    }
    .upload-box input[type="file"] {
      display: none;
    }
    .upload-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 20px;
      background: #0284c7;
      color: #fff;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .excel-container {
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
      background: #ffffff;
    }

    .excel-container iframe {
      width: 100%;
      height: 650px;
      border: none;
      display: block;
    }

    /* Table Preview Styling */
    .table-wrapper {
      max-height: 350px;
      overflow: auto;
      margin-top: 15px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
    }
    .parsed-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      color: var(--text-color);
    }
    .parsed-table th, .parsed-table td {
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      text-align: left;
    }
    .parsed-table th {
      background: var(--card-bg);
      color: var(--icon-color);
    }

    .user-login-modal { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(15, 23, 42, 0.95); display: flex; justify-content: center; 
      align-items: center; z-index: 999; 
    }
    .modal-content { 
      background: var(--modal-bg); color: var(--text-color); padding: 28px; 
      border-radius: 16px; width: 330px; border: 1px solid var(--modal-border); 
      text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); 
    }
    .modal-content input { 
      width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--input-border); 
      background: var(--input-bg); color: var(--text-color); border-radius: 8px; outline: none; 
    }
    .modal-content button { 
      padding: 12px; margin-top: 5px; cursor: pointer; border: none; 
      border-radius: 8px; font-weight: bold; background: #0284c7; color: white; width: 100%; 
    }

    .logout-btn { 
      position: fixed; left: 20px; bottom: 20px; padding: 10px 18px; border-radius: 20px; 
      border: none; background: #e11d48; color: white; font-size: 14px; font-weight: bold; 
      cursor: pointer; z-index: 1000; box-shadow: 0 4px 10px rgba(225, 29, 72, 0.3); 
    }
  </style>
</head>

<body oncontextmenu="return false;">

  <div class="bg-video-container">
    <video autoplay loop muted playsinline poster="https://images.unsplash.com/photo-1506744038136-46273834b3fb">
      <source src="https://assets.mixkit.co/videos/preview/mixkit-timelapse-of-clouds-and-mountains-2408-large.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>
  </div>

  <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
    <i class="fas fa-moon" id="themeIcon"></i>
    <span id="themeText">Dark Sky</span>
  </button>

  <div class="user-login-modal" id="userLoginModal">
    <div class="modal-content" id="loginBox">
      <h3 style="margin-bottom: 15px;"><i class="fas fa-shield-alt" style="color: var(--icon-color);"></i> Secure Login</h3>
      <input type="email" id="userInputEmail" placeholder="Email Address" autocomplete="off">
      <input type="password" id="userInputPass" placeholder="Password" autocomplete="off">
      <button onclick="checkUserLogin()">Login</button>
      <div id="loginError" style="color: #f44336; font-size: 12px; margin-top: 10px; display: none;"></div>
    </div>
  </div>

  <div class="dashboard" id="mainDashboard" style="display: none;">
    <div class="main-header">ESER-ALL Portal</div>

    <!-- Section 1: Excel/CSV File Direct Upload -->
    <div class="section-title"><i class="fas fa-file-upload"></i> Direct Excel / CSV File Upload</div>
    <div class="worksheet-section">
      <div class="upload-box" onclick="document.getElementById('excelFileInput').click()">
        <i class="fas fa-cloud-upload-alt"></i>
        <h3>Click or Drag & Drop Excel / CSV File Here</h3>
        <p style="font-size: 12px; opacity: 0.8; margin-top: 5px;">Supports .xlsx, .xls, .csv files</p>
        <span class="upload-btn">Browse File</span>
        <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" onchange="handleFileUpload(event)">
      </div>
      
      <!-- Uploaded File Data Table Preview -->
      <div id="uploadedDataContainer" style="display: none;">
        <h4 style="margin-bottom: 8px; text-align: left;"><i class="fas fa-table"></i> Uploaded Sheet Data Preview:</h4>
        <div class="table-wrapper" id="tablePreviewWrapper"></div>
      </div>
    </div>

    <!-- Section 2: Google Sheet Embed Live Editor -->
    <div class="section-title"><i class="fas fa-file-excel"></i> Live Google Sheet Editor</div>
    <div class="worksheet-section">
      <div class="excel-container">
        <!-- Google Sheet Editable Link (Make sure Share Setting is set to Anyone with the link CAN EDIT) -->
        <iframe src="https://docs.google.com/spreadsheets/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/edit?usp=sharing&rm=demo"></iframe>
      </div>
    </div>
  </div>

  <button class="logout-btn" id="btnLogout" style="display: none;" onclick="userLogout()">
    <i class="fas fa-sign-out-alt"></i> Logout
  </button>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script>
    document.addEventListener('keydown', function(e) {
      if (e.keyCode === 123 || 
         (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
         (e.ctrlKey && e.keyCode === 85)) {
        e.preventDefault();
        return false;
      }
    });

    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeUI(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeUI(newTheme);
    }

    function updateThemeUI(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'light') {
        icon.className = 'fas fa-sun';
        text.innerText = 'Sky Light';
      } else {
        icon.className = 'fas fa-moon';
        text.innerText = 'Night Sky';
      }
    }
    initTheme();

    const firebaseConfig = {
      apiKey: "AIzaSyDB4r_a5gPtKhlzM0qqmYHBb6HA_I2SmHQ",
      authDomain: "eser-all.firebaseapp.com",
      databaseURL: "https://eser-all-default-rtdb.firebaseio.com",
      projectId: "eser-all",
      storageBucket: "eser-all.firebasestorage.app",
      messagingSenderId: "741870576674",
      appId: "1:741870576674:web:2a5094bd05f44f0b98d67b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function checkUserLogin() {
      const email = document.getElementById('userInputEmail').value.trim();
      const pass = document.getElementById('userInputPass').value.trim();
      const errorDiv = document.getElementById('loginError');

      if (!email || !pass) {
        errorDiv.innerText = "Please enter both email & password.";
        errorDiv.style.display = "block";
        return;
      }

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => {
          errorDiv.style.display = "none";
          showDashboard();
        })
        .catch((error) => {
          errorDiv.innerText = "Invalid Login Credentials!";
          errorDiv.style.display = "block";
        });
    }

    auth.onAuthStateChanged((user) => {
      if (user) {
        showDashboard();
      } else {
        document.getElementById('userLoginModal').style.display = 'flex';
        document.getElementById('mainDashboard').style.display = 'none';
        document.getElementById('btnLogout').style.display = 'none';
      }
    });

    function showDashboard() {
      document.getElementById('userLoginModal').style.display = 'none';
      document.getElementById('mainDashboard').style.display = 'block';
      document.getElementById('btnLogout').style.display = 'block';
    }

    function userLogout() {
      auth.signOut().then(() => {
        location.reload();
      });
    }

    // Direct Excel / CSV File Parsing Function
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        
        // Convert sheet to HTML Table
        const htmlTable = XLSX.utils.sheet_to_html(worksheet, { id: 'parsedExcelTable', editable: true });
        
        document.getElementById('tablePreviewWrapper').innerHTML = htmlTable;
        document.getElementById('uploadedDataContainer').style.display = 'block';
        
        // Add styling class to generated table
        const table = document.getElementById('parsedExcelTable');
        if (table) table.classList.add('parsed-table');
      };
      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
