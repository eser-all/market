    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #121212;
            color: #f0f0f0;
            transition: background .3s, color .3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        body.light-mode {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
        }

        @keyframes gradientBG {
            0% { background-position: 0 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 0;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .theme-toggle {
            position: fixed;
            left: 20px;
            bottom: 20px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: rgba(255, 255, 255, .1);
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
        }

        .dashboard {
            position: relative;
            z-index: 1;
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .main-header {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: .5px;
        }

        /* Spreadsheet Section UI */
        .sheet-wrapper {
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        body.light-mode .sheet-wrapper {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .sheet-toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-input {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            outline: none;
            width: 250px;
            font-size: 14px;
        }

        .btn {
            padding: 9px 16px;
            border-radius: 6px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-primary { background: #38bdf8; color: #000; }
        .btn-primary:hover { background: #0284c7; color: #fff; }

        .btn-success { background: #4CAF50; color: #fff; }
        .btn-success:hover { background: #388E3C; }

        .btn-danger { background: #f44336; color: #fff; }
        .btn-danger:hover { background: #d32f2f; }

        .btn-secondary { background: #6b7280; color: #fff; }

        .table-container {
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        th {
            position: sticky;
            top: 0;
            background: #252526;
            color: #38bdf8;
            padding: 12px 15px;
            font-weight: 700;
            border-bottom: 2px solid #444;
            z-index: 10;
        }

        td {
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            white-space: nowrap;
        }

        tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            font-size: 13px;
            color: #aaa;
        }

        /* Modal Style */

            top: 0;
            left: 0;
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            background: #1e1e1e;
            color: #fff;
            padding: 24px;
            border-radius: 10px;
            width: 360px;
            border: 1px solid #333;
            text-align: center;
            position: relative;
        }

        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            border-radius: 6px;
            outline: 0;
            font-family: inherit;
        }

        .modal-content button {
            width: 100%;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 16px;
            color: #aaa;
            cursor: pointer;
        }

        .close-btn:hover { color: #fff; }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 15px 0;
            color: #888;
            font-size: 12px;
        }

        .divider::after, .divider::before {
            content: '';
            flex: 1;
            border-bottom: 1px solid #444;
        }

        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        .google-btn {
            background: #fff !important;
            color: #333 !important;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid #ccc !important;
        }

        .logout-btn {
            position: fixed;
            right: 20px;
            bottom: 20px;
            padding: 10px 18px;
            border-radius: 20px;
            border: none;
            background: #e11d48;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(225,29,72,.3);
        }

        .badge-info {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

<body oncontextmenu="return false;">

    <div id="particles-js"></div>

    <!-- Theme Toggle -->
    <div class="theme-toggle" id="themeToggleBtn">
        <i class="fas fa-moon" id="themeIcon"></i>
    </div>

    <!-- Firebase Auth Modal -->
    <div class="user-login-modal" id="userLoginModal">
        <div class="modal-content" id="loginBox">
            <h3 style="margin-bottom:15px">
                <i class="fas fa-shield-alt" style="color:#38bdf8"></i> Secure Login
            </h3>
            <input type="email" id="userInputEmail" placeholder="Email Address" autocomplete="off">
            <input type="password" id="userInputPass" placeholder="Password" autocomplete="off">
            <button class="btn btn-success" id="btnLoginSubmit">Login</button>
            <div class="divider">OR</div>
            <button class="google-btn btn" id="btnGoogleLogin">
                <i class="fab fa-google" style="color:#ea4335;font-size:16px"></i> Sign in with Google
            </button>
            <div id="loginError" style="color:#f44336;font-size:12px;margin-top:10px;display:none"></div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div class="dashboard" id="mainDashboard" style="display:none">
        <div class="main-header">ESER-ALL Portal</div>

        <!-- Google Sheet Data Section -->
        <div class="sheet-wrapper">
            <div class="sheet-toolbar">
                <div class="toolbar-group">
                    <h2 style="font-size: 20px;"><i class="fas fa-table" style="color: #38bdf8;"></i> Spreadsheet Engine</h2>
                    <span class="badge-info" id="totalRecordsCount">Total Rows: 0</span>
                </div>
                <div class="toolbar-group">
                    <input type="text" id="sheetSearchInput" class="search-input" placeholder="Search 100,000+ records...">
                    <button class="btn btn-success" id="btnOpenAddModal"><i class="fas fa-plus"></i> Add Row</button>
                    <button class="btn btn-primary" id="btnRefreshSheet"><i class="fas fa-sync"></i> Sync</button>
                </div>
            </div>

            <div class="table-container">
                <table id="spreadsheetTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Value / Details</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="sheetTableBody">
                        <tr>
                            <td colspan="6" style="text-align:center; padding: 30px;">
                                <i class="fas fa-spinner fa-spin" style="font-size: 24px;"></i><br><br>
                                Loading Spreadsheet Engine...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <div id="pageInfo">Showing Page 1</div>
                <div class="toolbar-group">
                    <button class="btn btn-secondary" id="btnPrevPage"><i class="fas fa-chevron-left"></i> Prev</button>
                    <button class="btn btn-secondary" id="btnNextPage">Next <i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add / Edit Modal -->
    <div class="data-modal" id="dataRowModal" style="display:none;">
        <div class="modal-content">
            <span class="close-btn" id="btnCloseDataModal"><i class="fas fa-times"></i></span>
            <h3 id="dataModalTitle" style="margin-bottom:15px"><i class="fas fa-edit" style="color:#38bdf8"></i> Add Record</h3>
            <form id="dataRowForm">
                <input type="hidden" id="rowId">
                <input type="text" id="rowName" placeholder="Name / Title" required>
                <input type="text" id="rowCategory" placeholder="Category" required>
                <input type="text" id="rowValue" placeholder="Value or Details" required>
                <input type="text" id="rowStatus" placeholder="Status (e.g. Active)" required>
                <button type="submit" class="btn btn-success" id="btnSaveDataRow">Save Record</button>
            </form>
        </div>
    </div>

    <button class="logout-btn" id="btnLogout" style="display:none">
        <i class="fas fa-sign-out-alt"></i> Logout
    </button>

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script>

        firebase.initializeApp({
            apiKey: _0x3a4b[0],

        });

        var auth = firebase.auth();

        // --- Google App Script Web App API Endpoint ---
        // (আপনার Google App Script Deploy করে পাওয়া Web App URL টি এখানে বসাতে হবে)
        const GOOGLE_SCRIPT_API_URL = "https://script.google.com/macros/s/YOUR_DEPLOYED_SCRIPT_ID/exec";

        // --- Global Variables ---
        let dataset = [];
        let filteredDataset = [];
        let currentPage = 1;
        const pageSize = 50; // Performance optimization for 100k rows

        // --- UI & Event Listeners ---
        document.addEventListener("DOMContentLoaded", () => {
            initParticles();
            setupThemeToggle();
            setupAuthEvents();
            setupSpreadsheetEvents();
        });

        // Background Particles
        function initParticles() {
            if (typeof particlesJS !== 'undefined') {
                particlesJS('particles-js', {
                    particles: {
                        number: { value: 40, density: { enable: true, value_area: 800 } },
                        color: { value: "#ffffff" },
                        opacity: { value: 0.2 },
                        size: { value: 3 },
                        line_linked: { enable: true, distance: 150, color: "#ffffff", opacity: 0.1, width: 1 },
                        move: { enable: true, speed: 2 }
                    }
                });
            }
        }

        // Theme Toggle Functionality
        function setupThemeToggle() {
            const toggleBtn = document.getElementById('themeToggleBtn');
            const icon = document.getElementById('themeIcon');

            toggleBtn.addEventListener('click', () => {
                document.body.classList.toggle('light-mode');
                if (document.body.classList.contains('light-mode')) {
                    icon.className = 'fas fa-sun';
                } else {
                    icon.className = 'fas fa-moon';
                }
            });
        }

        // Authentication Handler
        function setupAuthEvents() {
            const loginModal = document.getElementById('userLoginModal');
            const dashboard = document.getElementById('mainDashboard');
            const btnLogout = document.getElementById('btnLogout');
            const loginError = document.getElementById('loginError');

            auth.onAuthStateChanged(user => {
                if (user) {
                    loginModal.style.display = 'none';
                    dashboard.style.display = 'block';
                    btnLogout.style.display = 'block';
                    loadSpreadsheetData();
                } else {
                    loginModal.style.display = 'flex';
                    dashboard.style.display = 'none';
                    btnLogout.style.display = 'none';
                }
            });

            document.getElementById('btnLoginSubmit').addEventListener('click', () => {
                const email = document.getElementById('userInputEmail').value;
                const pass = document.getElementById('userInputPass').value;
                loginError.style.display = 'none';

                auth.signInWithEmailAndPassword(email, pass).catch(err => {
                    loginError.innerText = err.message;
                    loginError.style.display = 'block';
                });
            });

            document.getElementById('btnGoogleLogin').addEventListener('click', () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).catch(err => {
                    loginError.innerText = err.message;
                    loginError.style.display = 'block';
                });
            });

            btnLogout.addEventListener('click', () => {
                auth.signOut();
            });
        }

        // --- Google Spreadsheet Engine ---

        function setupSpreadsheetEvents() {
            document.getElementById('sheetSearchInput').addEventListener('input', handleSearch);
            document.getElementById('btnRefreshSheet').addEventListener('click', loadSpreadsheetData);
            document.getElementById('btnPrevPage').addEventListener('click', () => changePage(-1));
            document.getElementById('btnNextPage').addEventListener('click', () => changePage(1));
            
            // Modal Handlers
            document.getElementById('btnOpenAddModal').addEventListener('click', () => openDataModal());
            document.getElementById('btnCloseDataModal').addEventListener('click', closeDataModal);
            document.getElementById('dataRowForm').addEventListener('submit', handleFormSubmit);
        }

        // Fetch Data from Google Sheet Engine
        async function loadSpreadsheetData() {
            const tbody = document.getElementById('sheetTableBody');
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 30px;"><i class="fas fa-spinner fa-spin" style="font-size: 24px;"></i><br><br>Syncing Data...</td></tr>`;

            try {
                // If API is connected, uncomment line below:
                // const res = await fetch(GOOGLE_SCRIPT_API_URL + "?action=read");
                // dataset = await res.json();

                // Mocking 100k high performance Virtual Dataset
                if (dataset.length === 0) {
                    dataset = generateMockLargeDataset(100000);
                }

                filteredDataset = [...dataset];
                document.getElementById('totalRecordsCount').innerText = `Total Rows: ${dataset.length.toLocaleString()}`;
                currentPage = 1;
                renderTable();
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#f44336; padding:20px;">Failed to fetch data from Spreadsheet API</td></tr>`;
            }
        }

        // Virtualized Render for 100,000 Rows
        function renderTable() {
            const tbody = document.getElementById('sheetTableBody');
            tbody.innerHTML = '';

            const startIdx = (currentPage - 1) * pageSize;
            const endIdx = Math.min(startIdx + pageSize, filteredDataset.length);
            const pageData = filteredDataset.slice(startIdx, endIdx);

            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:20px;">No matching records found.</td></tr>`;
                document.getElementById('pageInfo').innerText = `Page 0 of 0`;
                return;
            }

            pageData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.id}</td>
                    <td><b>${escapeHtml(row.name)}</b></td>
                    <td>${escapeHtml(row.category)}</td>
                    <td>${escapeHtml(row.value)}</td>
                    <td><span class="badge-info">${escapeHtml(row.status)}</span></td>
                    <td>
                        <button class="btn btn-primary" onclick="editRow('${row.id}')" style="padding: 4px 8px; font-size:11px;"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-danger" onclick="deleteRow('${row.id}')" style="padding: 4px 8px; font-size:11px;"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            const totalPages = Math.ceil(filteredDataset.length / pageSize);
            document.getElementById('pageInfo').innerText = `Page ${currentPage} of ${totalPages} (${startIdx + 1}-${endIdx} of ${filteredDataset.length.toLocaleString()})`;
            
            document.getElementById('btnPrevPage').disabled = currentPage === 1;
            document.getElementById('btnNextPage').disabled = currentPage >= totalPages;
        }

        function handleSearch(e) {
            const query = e.target.value.toLowerCase().trim();
            filteredDataset = dataset.filter(item => 
                item.name.toLowerCase().includes(query) ||
                item.category.toLowerCase().includes(query) ||
                item.id.toString().includes(query)
            );
            currentPage = 1;
            renderTable();
        }

        function changePage(direction) {
            const totalPages = Math.ceil(filteredDataset.length / pageSize);
            if (currentPage + direction >= 1 && currentPage + direction <= totalPages) {
                currentPage += direction;
                renderTable();
            }
        }

        // Add / Edit Record Modal Controls
        function openDataModal(row = null) {
            const modal = document.getElementById('dataRowModal');
            const title = document.getElementById('dataModalTitle');
            
            if (row) {
                title.innerHTML = `<i class="fas fa-edit" style="color:#38bdf8"></i> Edit Record`;
                document.getElementById('rowId').value = row.id;
                document.getElementById('rowName').value = row.name;
                document.getElementById('rowCategory').value = row.category;
                document.getElementById('rowValue').value = row.value;
                document.getElementById('rowStatus').value = row.status;
            } else {
                title.innerHTML = `<i class="fas fa-plus" style="color:#4CAF50"></i> Add New Record`;
                document.getElementById('dataRowForm').reset();
                document.getElementById('rowId').value = '';
            }

            modal.style.display = 'flex';
        }

        function closeDataModal() {
            document.getElementById('dataRowModal').style.display = 'none';
        }

        // CRUD Operations
        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('rowId').value;
            const rowData = {
                id: id ? id : 'ROW-' + (dataset.length + 1),
                name: document.getElementById('rowName').value,
                category: document.getElementById('rowCategory').value,
                value: document.getElementById('rowValue').value,
                status: document.getElementById('rowStatus').value
            };

            if (id) {
                // Edit existing row
                const idx = dataset.findIndex(r => r.id === id);
                if (idx !== -1) dataset[idx] = rowData;
                syncWithGoogleSheet("update", rowData);
            } else {
                // Add new row
                dataset.unshift(rowData);
                syncWithGoogleSheet("create", rowData);
            }

            filteredDataset = [...dataset];
            document.getElementById('totalRecordsCount').innerText = `Total Rows: ${dataset.length.toLocaleString()}`;
            closeDataModal();
            renderTable();
        }

        function editRow(id) {
            const row = dataset.find(r => r.id === id);
            if (row) openDataModal(row);
        }

        function deleteRow(id) {
            if (confirm(`Are you sure you want to delete record ${id}?`)) {
                dataset = dataset.filter(r => r.id !== id);
                filteredDataset = filteredDataset.filter(r => r.id !== id);
                syncWithGoogleSheet("delete", { id: id });
                document.getElementById('totalRecordsCount').innerText = `Total Rows: ${dataset.length.toLocaleString()}`;
                renderTable();
            }
        }

        // Google Sheet Web API Sync Method
        async function syncWithGoogleSheet(action, payload) {
            console.log(`Syncing action [${action}] to Google Sheet:`, payload);
            /*
            fetch(GOOGLE_SCRIPT_API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, data: payload })
            });
            */
        }

        // Generating Fast 100,000 Mock Records for Testing Performance
        function generateMockLargeDataset(count) {
            const data = [];
            const categories = ['Finance', 'IT Support', 'Operations', 'HR', 'Logistics'];
            const statuses = ['Active', 'Pending', 'Archived', 'Completed'];

            for (let i = 1; i <= count; i++) {
                data.push({
                    id: `REC-${100000 + i}`,
                    name: `Data Entry Record Item #${i}`,
                    category: categories[i % categories.length],
                    value: `Val-${(i * 3.14).toFixed(2)}`,
                    status: statuses[i % statuses.length]
                });
            }
            return data;
        }

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
