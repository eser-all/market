<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart WiFi Zone</title>
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --success-color: #16a34a;
      --success-hover: #15803d;
      --bkash-color: #e2136e;
      --bkash-hover: #c20f5d;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    /* System Dark Mode Support */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #334155;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
      padding: 24px 20px;
      text-align: center;
      position: relative;
      border: none; /* নো বর্ডার */
    }

    /* Live Network Status Indicator */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(22, 163, 74, 0.12);
      color: var(--success-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success-color);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success-color);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* Header & Large Typography */
    .brand-icon {
      font-size: 32px;
      margin-bottom: 4px;
      display: block;
    }

    .header-title {
      color: var(--text-main);
      font-size: 26px; /* বড় সাইজ */
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px; /* বড় সাইজ */
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 22px;
    }

    /* Tab Navigation (No Borders) */
    .tab-container {
      display: flex;
      background: rgba(0, 0, 0, 0.05);
      border: none;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      border: none;
      background: transparent;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 9px;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Form Elements & Inputs */
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 700;
      color: var(--text-main);
      font-size: 14px; /* বড় ও স্পষ্ট */
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="text"], 
    input[type="tel"], 
    input[type="password"] {
      width: 100%;
      height: 48px;
      padding: 0 40px 0 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 16px; /* টাইপ করার সময় চমৎকার স্পষ্টতা */
      outline: none;
      background: var(--card-bg);
      color: var(--text-main);
      transition: border-color 0.2s ease;
      -webkit-appearance: none;
    }

    input[type="text"]:focus, 
    input[type="tel"]:focus,
    input[type="password"]:focus {
      border-color: var(--primary-color);
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      display: none;
    }

    .pin-input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pin-input {
      text-align: center;
      font-size: 18px !important;
      letter-spacing: 2px;
      font-weight: 700;
      padding-right: 120px !important;
    }

    .pin-actions {
      position: absolute;
      right: 6px;
      display: flex;
      gap: 5px;
    }

    .action-icon-btn {
      background: rgba(37, 99, 235, 0.1);
      color: var(--primary-color);
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    /* Smart Package Cards (Grid View) */
    .package-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .package-card {
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .package-card.selected {
      border-color: var(--bkash-color);
      background: rgba(226, 19, 110, 0.05);
    }

    .pkg-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .pkg-price {
      font-size: 16px;
      font-weight: 800;
      color: var(--bkash-color);
      margin-top: 2px;
    }

    /* Buttons */
    .btn {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 10px;
      font-size: 16px; /* বড় বাটন টেক্সট */
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-green { background: var(--success-color); color: #fff; }
    .btn-green:hover { background: var(--success-hover); }
    .btn-bkash { background: var(--bkash-color); color: #fff; }
    .btn-bkash:hover { background: var(--bkash-hover); }

    /* Support Floating Bar */
    .support-bar {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .support-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 700;
    }

    .footer {
      margin-top: 16px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px dashed var(--border-color);
      padding-top: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="status-badge">
      <span class="status-dot"></span> হাই-স্পিড নেটওয়ার্ক অ্যাক্টিভ
    </div>
    
    <span class="brand-icon">📶</span>
    <h1 class="header-title">Smart WiFi Zone</h1>
    <p class="subtitle">ইন্টারনেট কানেক্ট করতে পিন বা পেমেন্ট বেছে নিন</p>

    <!-- Tab Navigation -->
    <div class="tab-container">
      <button type="button" class="tab-btn active" onclick="switchTab('voucher')">🎟️ ১০ ডিজিটের পিন</button>
      <button type="button" class="tab-btn" onclick="switchTab('online')">💳 বিকাশ / অনলাইন</button>
    </div>

    <!-- TAB 1: VOUCHER LOGIN -->
    <div id="voucher-tab" class="tab-content active">
      <form name="login" id="loginForm" action="$(link-login-only)" method="post" onsubmit="return handleVoucherLogin(event)">
        <input type="hidden" name="dst" value="$(link-orig)" />
        <input type="hidden" name="popup" value="true" />
        <input type="hidden" id="username" name="username" />
        <input type="hidden" id="password" name="password" />

        <div class="form-group">
          <label for="user_phone">মোবাইল নম্বর:</label>
          <div class="input-wrapper">
            <input type="tel" id="user_phone" placeholder="017XXXXXXXX" maxlength="11" pattern="[0-9]{11}" required autocomplete="off" oninput="toggleClearBtn(this, 'phone_clear')">
            <button type="button" id="phone_clear" class="clear-btn" onclick="clearInput('user_phone', 'phone_clear')">✕</button>
          </div>
        </div>

        <div class="form-group">
          <label for="pin_code">১০ ডিজিটের পিন (PIN) কোড:</label>
          <div class="pin-input-group">
            <input type="password" id="pin_code" class="pin-input" placeholder="9847201834" maxlength="10" pattern="[0-9]{10}" required autocomplete="off">
            <div class="pin-actions">
              <button type="button" class="action-icon-btn" onclick="togglePinVisibility()">👁️</button>
              <button type="button" class="action-icon-btn" onclick="startScanner()">📷 স্ক্যান</button>
            </div>
          </div>
        </div>

        <!-- Smart QR Scanner Box -->
        <div id="qr-reader-wrapper" style="display:none; margin-bottom:14px;">
          <div id="reader"></div>
          <button type="button" class="action-icon-btn" style="width:100%; margin-top:8px;" onclick="stopScanner()">ক্যামেরা বন্ধ করুন</button>
        </div>

        <button type="submit" class="btn btn-green" id="submitBtn">ইন্টারনেট চালু করুন</button>
      </form>
    </div>

    <!-- TAB 2: ONLINE PAYMENT -->
    <div id="online-tab" class="tab-content">
      <form action="https://us-central1-YOUR_PROJECT_ID.cloudfunctions.net/initiatePayment" method="POST">
        <input type="hidden" name="mac" value="$(mac)">
        <input type="hidden" name="ip" value="$(ip)">
        <input type="hidden" name="package_id" id="selected_package_id" value="pkg_200tk_1m">

        <div class="form-group">
          <label for="online_phone">মোবাইল নম্বর:</label>
          <div class="input-wrapper">
            <input type="tel" name="phone" id="online_phone" placeholder="017XXXXXXXX" maxlength="11" pattern="[0-9]{11}" required autocomplete="off" oninput="toggleClearBtn(this, 'online_phone_clear')">
            <button type="button" id="online_phone_clear" class="clear-btn" onclick="clearInput('online_phone', 'online_phone_clear')">✕</button>
          </div>
        </div>

        <!-- Package Grid Cards -->
        <div class="form-group">
          <label>প্যাকেজ নির্বাচন করুন:</label>
          <div class="package-grid">
            <div class="package-card" onclick="selectPackage('pkg_10tk_1hr', this)">
              <div class="pkg-title">১ ঘণ্টা</div>
              <div class="pkg-price">৳ ১০</div>
            </div>
            <div class="package-card" onclick="selectPackage('pkg_20tk_3hr', this)">
              <div class="pkg-title">৩ ঘণ্টা</div>
              <div class="pkg-price">৳ ২০</div>
            </div>
            <div class="package-card" onclick="selectPackage('pkg_50tk_3day', this)">
              <div class="pkg-title">৩ দিন</div>
              <div class="pkg-price">৳ ৫০</div>
            </div>
            <div class="package-card selected" onclick="selectPackage('pkg_200tk_1m', this)">
              <div class="pkg-title">১ মাস ⭐</div>
              <div class="pkg-price">৳ ২০০</div>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-bkash">bKash দিয়ে পেমেন্ট করুন</button>
      </form>
    </div>

    <!-- Live Helpdesk -->
    <div class="support-bar">
      <a href="https://wa.me/8801700000000" target="_blank" class="support-item">💬 WhatsApp</a>
      <a href="tel:01700000000" class="support-item">📞 হেল্পলাইন</a>
    </div>

    <div class="footer">
      Device MAC: $(mac) | Powered by Smart WiFi
    </div>
  </div>

  <script>
    const FIREBASE_USER_SAVE_URL = "https://us-central1-YOUR_PROJECT_ID.cloudfunctions.net/saveUserData";
    let html5QrcodeScanner = null;

    /* Toggle PIN Visibility */
    function togglePinVisibility() {
      const pinInput = document.getElementById('pin_code');
      pinInput.type = pinInput.type === 'password' ? 'text' : 'password';
    }

    /* Select Package Card */
    function selectPackage(pkgId, element) {
      document.querySelectorAll('.package-card').forEach(card => card.classList.remove('selected'));
      element.classList.add('selected');
      document.getElementById('selected_package_id').value = pkgId;
    }

    function switchTab(tabName) {
      document.getElementById('voucher-tab').classList.remove('active');
      document.getElementById('online-tab').classList.remove('active');
      const buttons = document.querySelectorAll('.tab-btn');
      buttons[0].classList.remove('active');
      buttons[1].classList.remove('active');

      if(tabName === 'voucher') {
        document.getElementById('voucher-tab').classList.add('active');
        buttons[0].classList.add('active');
      } else {
        document.getElementById('online-tab').classList.add('active');
        buttons[1].classList.add('active');
        stopScanner();
      }
    }

    function toggleClearBtn(input, btnId) {
      document.getElementById(btnId).style.display = input.value.length > 0 ? 'block' : 'none';
    }

    function clearInput(inputId, btnId) {
      document.getElementById(inputId).value = '';
      document.getElementById(btnId).style.display = 'none';
    }

    /* QR Scanner Functions */
    function startScanner() {
      document.getElementById('qr-reader-wrapper').style.display = 'block';
      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 180, height: 180 } });
        html5QrcodeScanner.render((decodedText) => {
          const extractedPin = decodedText.replace(/\D/g, '').slice(0, 10);
          if (extractedPin.length === 10) {
            document.getElementById('pin_code').value = extractedPin;
            if (navigator.vibrate) navigator.vibrate(100);
            stopScanner();
          }
        });
      }
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().then(() => {
          html5QrcodeScanner = null;
          document.getElementById('qr-reader-wrapper').style.display = 'none';
        });
      }
    }

    async function handleVoucherLogin(event) {
      event.preventDefault();
      const phone = document.getElementById('user_phone').value.trim();
      const pin = document.getElementById('pin_code').value.trim();
      const mac = "$(mac)";
      const submitBtn = document.getElementById('submitBtn');

      if (phone.length !== 11 || pin.length !== 10) {
        alert("সঠিক ১১ ডিজিটের মোবাইল নম্বর এবং ১০ ডিজিটের পিন কোড দিন!");
        return false;
      }

      submitBtn.innerText = "যাচাই করা হচ্ছে...";
      submitBtn.disabled = true;

      try {
        await fetch(FIREBASE_USER_SAVE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mac: mac, phone: phone })
        });
      } catch (error) {
        console.log("Firebase sync warning:", error);
      }

      document.getElementById('username').value = pin;
      document.getElementById('password').value = pin;
      document.getElementById('loginForm').submit();
    }
  </script>
</body>
</html>
