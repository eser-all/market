<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>দোকানের হিসাব-নিকাশ ও ক্যাশ বুক</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SheetJS for Excel Download/Upload -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .badge-mfs { background-color: #e2136e; color: white; }
    .badge-print { background-color: #007bff; color: white; }
    .badge-stationery { background-color: #28a745; color: white; }
  </style>
</head>
<body class="p-3 p-md-4">

<div class="container-fluid">
  <h2 class="mb-4 text-center fw-bold text-primary">দোকানের দৈনিক হিসাব-নিকাশ ড্যাশবোর্ড</h2>

  <!-- Input Form -->
  <div class="row">
    <div class="col-md-4 mb-4">
      <div class="card p-3">
        <h5 class="card-title text-secondary">নতুন লেনদেন যোগ করুন</h5>
        <form id="transactionForm">
          <div class="mb-2">
            <label class="form-label">খাত / বিভাগ</label>
            <select id="category" class="form-select" required>
              <option value="Mobile Banking">মোবাইল ব্যাংকিং (বিকাশ/নগদ/রকেট)</option>
              <option value="Print & Photo">প্রিন্ট ও ফটোকপি</option>
              <option value="Stationery">স্টেশনারি পণ্য</option>
              <option value="Expense">অন্যান্য খরচ</option>
            </select>
          </div>

          <div class="mb-2">
            <label class="form-label">লেনদেনের ধরন</label>
            <select id="type" class="form-select" required>
              <option value="Cash In">ক্যাশ-ইন / বিক্রি (জমা)</option>
              <option value="Cash Out">ক্যাশ-আউট / খরচ (খরচ)</option>
            </select>
          </div>

          <div class="mb-2">
            <label class="form-label">বিবরণ / কাস্টমার / নোট</label>
            <input type="text" id="description" class="form-control" placeholder="যেমন: বিকাশ ক্যাশ-আউট / ১০ কপি ফটোকপি" required>
          </div>

          <div class="mb-2">
            <label class="form-label">পরিমাণ (টাকা)</label>
            <input type="number" id="amount" class="form-control" placeholder="0.00" min="0" step="any" required>
          </div>

          <div class="mb-3">
            <label class="form-label">কমিশন / নিট লাভ (যদি থাকে)</label>
            <input type="number" id="profit" class="form-control" placeholder="0.00" value="0" min="0" step="any">
          </div>

          <button type="submit" class="btn btn-primary w-100 fw-bold">এন্ট্রি করুন</button>
        </form>
      </div>
    </div>

    <!-- Summary & Data Table -->
    <div class="col-md-8">
      <!-- Excel & Offline Actions -->
      <div class="card p-3 mb-3">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">
          <span class="fw-bold text-muted">এক্সেল ম্যানেজমেন্ট & ব্যাকআপ:</span>
          <div class="d-flex gap-2">
            <button onclick="exportToExcel()" class="btn btn-success btn-sm">📥 Excel ডাউনলোড করুন</button>
            <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;" onchange="importFromExcel(event)">
            <button onclick="document.getElementById('excelFileInput').click()" class="btn btn-outline-success btn-sm">📤 Excel আপলোড করুন</button>
          </div>
        </div>
      </div>

      <!-- Total Summary Widgets -->
      <div class="row g-2 mb-3 text-center">
        <div class="col-6 col-md-3">
          <div class="card p-2 bg-white">
            <small class="text-muted">মোট ক্যাশ-ইন / বিক্রি</small>
            <h5 class="text-success fw-bold my-1" id="totalIn">৳ 0.00</h5>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card p-2 bg-white">
            <small class="text-muted">মোট ক্যাশ-আউট / খরচ</small>
            <h5 class="text-danger fw-bold my-1" id="totalOut">৳ 0.00</h5>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card p-2 bg-white">
            <small class="text-muted">আজকের নিট লাভ</small>
            <h5 class="text-primary fw-bold my-1" id="totalProfit">৳ 0.00</h5>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card p-2 bg-white">
            <small class="text-muted">মোট লেনদেন</small>
            <h5 class="text-dark fw-bold my-1" id="totalCount">0</h5>
          </div>
        </div>
      </div>

      <!-- Transaction Table -->
      <div class="card p-3">
        <h5 class="card-title text-secondary mb-3">আজকের লেনদেনের তালিকা</h5>
        <div class="table-responsive">
          <table class="table table-hover align-middle" id="transactionTable">
            <thead class="table-light">
              <tr>
                <th>সময়/তারিখ</th>
                <th>বিভাগ</th>
                <th>বিবরণ</th>
                <th>ধরন</th>
                <th>পরিমাণ</th>
                <th>লাভ</th>
                <th>অ্যাকশন</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- JS Populated -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  // ==========================================
  // ১. Firebase Configuration
  // ==========================================
  const firebaseConfig = {
    apiKey: "AIzaSyCb4fkOtdc83ZP6fX_pVU5pjWA0WviTLiI",
    authDomain: "eser-all-isp.firebaseapp.com",
    databaseURL: "https://eser-all-isp-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "eser-all-isp",
    storageBucket: "eser-all-isp.firebasestorage.app",
    messagingSenderId: "1095314995444",
    appId: "1:1095314995444:web:12ac46fc5823350bfb46a1",
    measurementId: "G-WBKJLWM3HD"
  };

  // Firebase Initialize
  let db;
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (e) {
    console.warn("Firebase initialization error:", e);
  }

  // Application Data Array
  let transactions = JSON.parse(localStorage.getItem('shop_transactions')) || [];

  // DOM Elements
  const form = document.getElementById('transactionForm');
  const tableBody = document.getElementById('tableBody');

  // Load Initial Data
  window.onload = () => {
    renderData();
    syncWithFirebase();
  };

  // ==========================================
  // ২. Form Submit - Save Entry
  // ==========================================
  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const entry = {
      id: Date.now().toString(),
      date: new Date().toLocaleString('bn-BD'),
      timestamp: Date.now(),
      category: document.getElementById('category').value,
      type: document.getElementById('type').value,
      description: document.getElementById('description').value,
      amount: parseFloat(document.getElementById('amount').value) || 0,
      profit: parseFloat(document.getElementById('profit').value) || 0
    };

    transactions.unshift(entry);
    saveData(entry);
    form.reset();
  });

  // Save to LocalStorage and Firebase Realtime Database
  function saveData(latestEntry) {
    localStorage.setItem('shop_transactions', JSON.stringify(transactions));
    renderData();

    if (db && latestEntry) {
      db.ref("transactions/" + latestEntry.id).set(latestEntry)
        .then(() => console.log("Saved to Firebase Realtime Database"))
        .catch(err => console.error("Firebase save error:", err));
    }
  }

  // ==========================================
  // ৩. Render UI Table & Summaries
  // ==========================================
  function renderData() {
    tableBody.innerHTML = '';
    let totalIn = 0, totalOut = 0, totalProfit = 0;

    transactions.forEach((item) => {
      if (item.type === 'Cash In') totalIn += item.amount;
      if (item.type === 'Cash Out') totalOut += item.amount;
      totalProfit += (item.profit || 0);

      let badgeClass = item.category === 'Mobile Banking' ? 'badge-mfs' : 
                        item.category === 'Print & Photo' ? 'badge-print' : 'badge-stationery';

      let row = `
        <tr>
          <td><small class="text-muted">${item.date}</small></td>
          <td><span class="badge ${badgeClass}">${item.category}</span></td>
          <td>${item.description}</td>
          <td><span class="${item.type === 'Cash In' ? 'text-success fw-bold' : 'text-danger fw-bold'}">${item.type}</span></td>
          <td class="fw-bold">৳ ${item.amount.toFixed(2)}</td>
          <td class="text-primary">৳ ${(item.profit || 0).toFixed(2)}</td>
          <td>
            <button onclick="deleteEntry('${item.id}')" class="btn btn-outline-danger btn-sm">মুছুন</button>
          </td>
        </tr>
      `;
      tableBody.innerHTML += row;
    });

    document.getElementById('totalIn').innerText = `৳ ${totalIn.toFixed(2)}`;
    document.getElementById('totalOut').innerText = `৳ ${totalOut.toFixed(2)}`;
    document.getElementById('totalProfit').innerText = `৳ ${totalProfit.toFixed(2)}`;
    document.getElementById('totalCount').innerText = transactions.length;
  }

  // Delete Entry
  function deleteEntry(id) {
    if (confirm("আপনি কি নিশ্চিত এই এন্ট্রিটি মুছে ফেলতে চান?")) {
      transactions = transactions.filter(item => item.id !== id);
      localStorage.setItem('shop_transactions', JSON.stringify(transactions));
      if (db) {
        db.ref("transactions/" + id).remove().catch(err => console.error(err));
      }
      renderData();
    }
  }

  // Sync Realtime Data from Firebase
  function syncWithFirebase() {
    if (db) {
      db.ref("transactions").on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          const fbData = Object.values(data);
          fbData.sort((a, b) => b.timestamp - a.timestamp);
          transactions = fbData;
          localStorage.setItem('shop_transactions', JSON.stringify(transactions));
          renderData();
        }
      }, (error) => {
        console.log("Realtime DB read error / Offline mode: ", error);
      });
    }
  }

  // ==========================================
  // ৪. Excel Export (ডাউনলোড)
  // ==========================================
  function exportToExcel() {
    if (transactions.length === 0) {
      alert("ডাউনলোড করার মতো কোনো ডেটা নেই!");
      return;
    }

    const excelData = transactions.map(t => ({
      "তারিখ ও সময়": t.date,
      "বিভাগ": t.category,
      "বিবরণ": t.description,
      "ধরন": t.type,
      "পরিমাণ (টাকা)": t.amount,
      "লাভ/কমিশন (টাকা)": t.profit
    }));

    const worksheet = XLSX.utils.json_to_sheet(excelData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "দোকানের হিসাব");

    XLSX.writeFile(workbook, `Daily_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  // ==========================================
  // ৫. Excel Import (আপলোড)
  // ==========================================
  function importFromExcel(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      const jsonData = XLSX.utils.sheet_to_json(worksheet);

      if (jsonData.length > 0) {
        jsonData.forEach((row, i) => {
          const newEntry = {
            id: (Date.now() + i).toString(),
            date: row["তারিখ ও সময়"] || new Date().toLocaleString('bn-BD'),
            timestamp: Date.now() + i,
            category: row["বিভাগ"] || "Stationery",
            description: row["বিবরণ"] || "Excel Imported",
            type: row["ধরন"] || "Cash In",
            amount: parseFloat(row["পরিমাণ (টাকা)"]) || 0,
            profit: parseFloat(row["লাভ/কমিশন (টাকা)"]) || 0
          };
          transactions.unshift(newEntry);
          if (db) {
            db.ref("transactions/" + newEntry.id).set(newEntry);
          }
        });

        localStorage.setItem('shop_transactions', JSON.stringify(transactions));
        renderData();
        alert("এক্সেল থেকে সফলভাবে ডেটা আপলোড করা হয়েছে!");
      }
    };
    reader.readAsArrayBuffer(file);
  }
</script>

</body>
</html>
