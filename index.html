<div class="row g-3 mb-4 text-center">
  <div class="col-6 col-lg-3">
    <div class="card card-custom p-3 bg-white stat-card stat-in">
      <div class="text-muted small fw-bold"><i class="fa-solid fa-arrow-down-long text-success me-1"></i> মোট জমা / বিক্রি</div>
      <h4 class="text-success fw-bold mt-2 mb-0" id="totalIn">৳ 0.00</h4>
    </div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="card card-custom p-3 bg-white stat-card stat-out">
      <div class="text-muted small fw-bold"><i class="fa-solid fa-arrow-up-long text-danger me-1"></i> মোট খরচ / ক্যাশ-আউট</div>
      <h4 class="text-danger fw-bold mt-2 mb-0" id="totalOut">৳ 0.00</h4>
    </div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="card card-custom p-3 bg-white stat-card stat-profit">
      <div class="text-muted small fw-bold"><i class="fa-solid fa-chart-line text-primary me-1"></i> মোট নিট লাভ</div>
      <h4 class="text-primary fw-bold mt-2 mb-0" id="totalProfit">৳ 0.00</h4>
    </div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="card card-custom p-3 bg-white stat-card stat-count">
      <div class="text-muted small fw-bold"><i class="fa-solid fa-receipt text-secondary me-1"></i> মোট লেনদেন সংখ্যা</div>
      <h4 class="text-dark fw-bold mt-2 mb-0" id="totalCount">0</h4>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-lg-4 mb-4">
    <div class="card card-custom p-4">
      <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-pen-to-square me-2 text-primary"></i>নতুন এন্ট্রি যুক্ত করুন</h5>
      <form id="transactionForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">খাত / বিভাগ</label>
          <select id="category" class="form-select shadow-sm" required>
            <option value="Mobile Banking">মোবাইল ব্যাংকিং (বিকাশ/নগদ/রকেট)</option>
            <option value="Print & Photo">প্রিন্ট ও ফটোকপি</option>
            <option value="Stationery">স্টেশনারি পণ্য</option>
            <option value="Expense">অন্যান্য খরচ</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">লেনদেনের ধরন</label>
          <select id="type" class="form-select shadow-sm" required>
            <option value="Cash In">ক্যাশ-ইন / জমা (বিক্রি)</option>
            <option value="Cash Out">ক্যাশ-আউট / খরচ</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">বিবরণ / কাস্টমার নোট</label>
          <input type="text" id="description" class="form-control shadow-sm" placeholder="যেমন: ১০ কপি ফটোকপি / বিকাশ ক্যাশ-আউট" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">পরিমাণ (টাকা)</label>
          <input type="number" id="amount" class="form-control shadow-sm" placeholder="0.00" min="0" step="any" required>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">কমিশন / নিট লাভ (যদি থাকে)</label>
          <input type="number" id="profit" class="form-control shadow-sm" placeholder="0.00" value="0" min="0" step="any">
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm py-2">
          <i class="fa-solid fa-floppy-disk me-1"></i> এন্ট্রি সংরক্ষণ করুন
        </button>
      </form>
    </div>
  </div>

  <div class="col-lg-8">
    <div class="table-container mb-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div class="d-flex gap-2 align-items-center">
          <input type="text" id="searchInput" onkeyup="_0x5a1b('filter')" class="form-control form-control-sm shadow-sm" placeholder="🔍 বিবরণ বা বিভাগ খুঁজুন...">
        </div>
        
        <div class="d-flex gap-2">
          <button onclick="_0x5a1b('export')" class="btn btn-outline-success btn-sm fw-bold">
            <i class="fa-solid fa-file-excel me-1"></i> Excel ডাউনলোড
          </button>
          <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;" onchange="_0x5a1b('import', event)">
          <button onclick="document.getElementById('excelFileInput').click()" class="btn btn-outline-primary btn-sm fw-bold">
            <i class="fa-solid fa-file-import me-1"></i> Excel আপলোড
          </button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle" id="transactionTable">
          <thead class="table-light">
            <tr>
              <th>তারিখ ও সময়</th>
              <th>বিভাগ</th>
              <th>বিবরণ</th>
              <th>ধরন</th>
              <th>পরিমাণ</th>
              <th>লাভ</th>
              <th class="text-center">অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
